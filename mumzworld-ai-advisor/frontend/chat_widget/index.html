<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumzworld AI Parenting Advisor</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f8e8f0 0%, #fdf3e7 50%, #e8f4f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .widget-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      text-align: center;
    }
    .header-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #e91e8c, #ff6b35);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-text { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .logo-text span { color: #e91e8c; }
    .header-sub { font-size: 13px; color: #666; }

    /* Chat container */
    .chat-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 560px;
    }

    /* Chat toolbar */
    .chat-toolbar {
      background: linear-gradient(135deg, #e91e8c, #ff6b35);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toolbar-avatar {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .toolbar-info { flex: 1; }
    .toolbar-name { color: white; font-weight: 600; font-size: 14px; }
    .toolbar-status { color: rgba(255,255,255,0.8); font-size: 11px; display: flex; align-items: center; gap: 4px; }
    .status-dot {
      width: 6px; height: 6px;
      background: #6dff6d;
      border-radius: 50%;
      display: inline-block;
    }
    .toolbar-badge {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }

    /* Message bubbles */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg-avatar.bot { background: linear-gradient(135deg, #e91e8c, #ff6b35); }
    .msg-avatar.user { background: #e8f4f8; }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .msg-bubble.bot {
      background: #f7f7f8;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.user {
      background: linear-gradient(135deg, #e91e8c, #ff6b35);
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Markdown-ish formatting inside bot bubbles */
    .msg-bubble.bot strong { font-weight: 600; color: #1a1a2e; }
    .msg-bubble.bot a {
      color: #e91e8c;
      text-decoration: none;
      font-weight: 500;
    }
    .msg-bubble.bot a:hover { text-decoration: underline; }

    /* Product cards */
    .product-card {
      background: white;
      border: 1px solid #f0e0ea;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .product-name {
      font-weight: 700;
      color: #1a1a2e;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .product-price {
      color: #e91e8c;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .product-meta {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .product-meta span { font-weight: 600; color: #333; }
    .safety-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff3f3;
      color: #c0392b;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .shop-btn {
      display: inline-block;
      background: linear-gradient(135deg, #e91e8c, #ff6b35);
      color: white !important;
      text-decoration: none !important;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-top: 6px;
      transition: opacity 0.2s;
    }
    .shop-btn:hover { opacity: 0.85; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: #f7f7f8;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: #ccc;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Quick prompts */
    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 20px 12px;
    }
    .quick-prompt-btn {
      background: #fdf0f7;
      border: 1px solid #f0c0dc;
      color: #c2185b;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .quick-prompt-btn:hover { background: #fce4ec; }

    /* Input area */
    .input-area {
      border-top: 1px solid #f0f0f0;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: white;
    }
    .input-box {
      flex: 1;
      border: 1.5px solid #e8e8e8;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.2s;
      color: #1a1a2e;
    }
    .input-box:focus { border-color: #e91e8c; }
    .input-box::placeholder { color: #bbb; }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #e91e8c, #ff6b35);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Error banner */
    .error-banner {
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      color: #c0392b;
      font-size: 12px;
      padding: 8px 14px;
      margin: 0 20px 10px;
      border-radius: 8px;
    }

    /* Config panel */
    .config-panel {
      background: white;
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 13px;
      color: #555;
    }
    .config-panel h4 { color: #1a1a2e; margin-bottom: 8px; font-size: 13px; }
    .config-row { display: flex; align-items: center; gap: 8px; }
    .api-input {
      flex: 1;
      border: 1.5px solid #e8e8e8;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .api-input:focus { border-color: #e91e8c; }
    .save-btn {
      background: #e91e8c;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .save-btn:hover { opacity: 0.85; }
    .mode-toggle {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }
    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: #ddd;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: #e91e8c; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const QUICK_PROMPTS = [
  "My 4-month-old hates tummy time 😩",
  "Looking for teethers for my 5-month-old",
  "Best high chair for starting solids at 6 months?",
  "My newborn won't sleep unless held",
  "Educational toys for my 18-month-old",
];

const BACKEND_URL = "http://localhost:8000";

function TypingIndicator() {
  return (
    <div className="msg-row">
      <div className="msg-avatar bot">👶</div>
      <div className="typing-indicator">
        <div className="typing-dot" />
        <div className="typing-dot" />
        <div className="typing-dot" />
      </div>
    </div>
  );
}

function ProductCard({ product }) {
  return (
    <div className="product-card">
      <div className="product-name">{product.name}</div>
      <div className="product-price">AED {product.price}</div>
      <div className="product-meta">
        <span>Age:</span> {product.age_min_months}–{product.age_max_months} months
      </div>
      <div className="product-meta">
        <span>Why great:</span> {product.why_great}
      </div>
      <div className="safety-badge">
        ⚠️ {product.safety_notes.length > 80
          ? product.safety_notes.substring(0, 80) + "…"
          : product.safety_notes}
      </div>
      <br />
      <a href={product.link} target="_blank" rel="noopener noreferrer" className="shop-btn">
        Shop on Mumzworld →
      </a>
    </div>
  );
}

function MessageBubble({ msg }) {
  if (msg.role === "user") {
    return (
      <div className="msg-row user">
        <div className="msg-avatar user">🙋</div>
        <div className="msg-bubble user">{msg.content}</div>
      </div>
    );
  }

  return (
    <div className="msg-row">
      <div className="msg-avatar bot">👶</div>
      <div style={{ maxWidth: "80%" }}>
        <div
          className="msg-bubble bot"
          dangerouslySetInnerHTML={{ __html: formatMarkdown(msg.content) }}
        />
        {msg.products && msg.products.length > 0 && (
          <div style={{ marginTop: 8 }}>
            {msg.products.map(p => <ProductCard key={p.id} product={p} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function formatMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\n/g, "<br/>");
}

const WELCOME_MSG = {
  role: "assistant",
  content: "Hi there! 👋 I'm Mumzworld's parenting advisor. I'm here to help you find the perfect products for your little one's age and stage.\n\nWhat's on your mind? You can tell me your baby's age and what challenge you're facing, and I'll recommend the right products from Mumzworld's catalogue.",
  products: [],
};

function App() {
  const [messages, setMessages] = useState([WELCOME_MSG]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [apiKey, setApiKey] = useState(localStorage.getItem("mw_api_key") || "");
  const [apiKeyInput, setApiKeyInput] = useState("");
  const [demoMode, setDemoMode] = useState(!localStorage.getItem("mw_api_key"));
  const messagesEndRef = useRef(null);
  const textareaRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  function saveApiKey() {
    const key = apiKeyInput.trim();
    if (!key) return;
    localStorage.setItem("mw_api_key", key);
    setApiKey(key);
    setDemoMode(false);
    setApiKeyInput("");
  }

  async function sendMessage(text) {
    const userText = (text || input).trim();
    if (!userText || loading) return;

    setInput("");
    setError(null);

    const userMsg = { role: "user", content: userText, products: [] };
    const history = messages.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content }));
    setMessages(prev => [...prev, userMsg]);
    setLoading(true);

    if (demoMode) {
      await simulateDemoResponse(userText);
      return;
    }

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userText, conversation_history: history }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const data = await res.json();
      setMessages(prev => [...prev, {
        role: "assistant",
        content: data.reply,
        products: [],
      }]);
    } catch (e) {
      setError(e.message.includes("Failed to fetch")
        ? "Cannot reach the backend. Make sure the FastAPI server is running on port 8000."
        : e.message);
      setMessages(prev => prev.slice(0, -1));
    } finally {
      setLoading(false);
    }
  }

  async function simulateDemoResponse(query) {
    await new Promise(r => setTimeout(r, 1200));

    const q = query.toLowerCase();
    let reply, products = [];

    if (q.includes("tummy time") || q.includes("4 month")) {
      reply = "That fussiness during tummy time is so common at 4 months — you're not alone! 💛 Babies at this stage are building the neck and core strength needed to eventually roll and sit, so it's worth persisting gently.\n\nHere are my top picks from the Mumzworld catalogue:";
      products = [
        { id:"MW-003", name:"Infantino Go gaga! Tummy Time Pillow", price:79, age_min_months:0, age_max_months:6,
          why_great:"The crescent shape lifts baby's chest, reducing the effort needed so they can enjoy tummy time longer and build strength faster.",
          safety_notes:"Never leave baby unattended on tummy time pillow. Not for sleeping.",
          link:"https://www.mumzworld.com/en/infantino-tummy-time-pillow" },
        { id:"MW-001", name:"Fisher-Price Deluxe Kick & Play Piano Gym", price:189, age_min_months:0, age_max_months:36,
          why_great:"High-contrast overhead toys give baby something fascinating to look at during tummy time, making it feel like play rather than exercise.",
          safety_notes:"No loose parts. Machine washable mat. Meets all ASTM safety standards.",
          link:"https://www.mumzworld.com/en/fisher-price-deluxe-kick-and-play-piano-gym" },
      ];
    } else if (q.includes("teethe") || q.includes("teet") || q.includes("drool") || q.includes("chew")) {
      reply = "Sounds like teething might be starting — it can begin as early as 3 months even if teeth don't appear until later! The drooling and chewing are classic early signs. 🦷\n\nHere are some great options:";
      products = [
        { id:"MW-010", name:"Manhattan Toy Winkel Rattle & Sensory Teether", price:89, age_min_months:3, age_max_months:18,
          why_great:"The looped shape is easy for small hands to grab at any angle, and the gentle rattle teaches cause-and-effect while soothing sore gums.",
          safety_notes:"BPA-free. Inspect regularly for cracks. Wipe clean with soap and water.",
          link:"https://www.mumzworld.com/en/manhattan-toy-winkel-teether" },
        { id:"MW-011", name:"Sophie la Girafe Teether", price:99, age_min_months:3, age_max_months:12,
          why_great:"Different body parts reach different parts of baby's mouth — the nose for front gums, legs for molars later on.",
          safety_notes:"Natural rubber — wipe exterior only, do not submerge in water.",
          link:"https://www.mumzworld.com/en/sophie-la-girafe-teether" },
      ];
    } else if (q.includes("sleep") || q.includes("hold") || q.includes("newborn")) {
      reply = "Oh, the 'only-sleep-when-held' stage is exhausting — but so understandable! Your newborn has just left the warmth of the womb and your heartbeat is their favourite comfort. 💗\n\nThese products can help create that cosy feeling safely:";
      products = [
        { id:"MW-019", name:"Summer Infant SwaddleMe Swaddle 3-Pack", price:99, age_min_months:0, age_max_months:3,
          why_great:"Suppresses the Moro (startle) reflex that wakes newborns — mimics the snug womb feeling without you having to hold them.",
          safety_notes:"Stop swaddling when baby shows rolling signs. Always place on back. Ensure hips have room to flex.",
          link:"https://www.mumzworld.com/en/summer-infant-swaddleme-3-pack" },
        { id:"MW-004", name:"BABYBJÖRN Bouncer Balance Soft", price:849, age_min_months:0, age_max_months:24,
          why_great:"Gentle self-bouncing motion powered by baby's own movement soothes fussy babies — gives you supervised hands-free moments.",
          safety_notes:"5-point safety harness. Do NOT use as sleeping device. Always use on floor level.",
          link:"https://www.mumzworld.com/en/babybjorn-bouncer-balance-soft" },
      ];
    } else if (q.includes("high chair") || q.includes("solid") || q.includes("wean") || q.includes("6 month")) {
      reply = "How exciting — starting solids is such a big milestone! At 6 months, the goal is to help baby sit upright with support and begin exploring food. Here are the best options from Mumzworld:";
      products = [
        { id:"MW-009", name:"STOKKE Tripp Trapp High Chair", price:1199, age_min_months:6, age_max_months:216,
          why_great:"Adjustable seat keeps baby at table height with the family, supporting natural self-feeding development from the very first spoon.",
          safety_notes:"Baby Set required for children under 3. Ensure all bolts tightened before each use.",
          link:"https://www.mumzworld.com/en/stokke-tripp-trapp-high-chair" },
        { id:"MW-008", name:"Chicco Pocket Snack Booster Seat", price:179, age_min_months:6, age_max_months:36,
          why_great:"Budget-friendly option that clips to any dining chair — perfect for starting solids at home and doubles as a travel seat.",
          safety_notes:"Only attach to chairs without armrests. Always secure safety belt.",
          link:"https://www.mumzworld.com/en/chicco-pocket-snack-booster-seat" },
      ];
    } else if (q.includes("18 month") || q.includes("toddler") || q.includes("educat") || q.includes("learn")) {
      reply = "18 months is such a fun age — toddlers this age are little sponges who learn through play! Here are my top picks for educational toys that match their developmental stage:";
      products = [
        { id:"MW-015", name:"LEGO DUPLO Classic Brick Box (85 pieces)", price:279, age_min_months:18, age_max_months:60,
          why_great:"Builds vocabulary (colours, shapes), fine motor pinch grip, and early engineering thinking — all while your toddler thinks they're just having fun.",
          safety_notes:"DUPLO bricks are oversized and non-choking-hazard safe for toddlers. Not compatible with standard LEGO.",
          link:"https://www.mumzworld.com/en/lego-duplo-classic-brick-box" },
        { id:"MW-025", name:"Melissa & Doug Shape Sorting Cube", price:99, age_min_months:12, age_max_months:36,
          why_great:"Shape sorting is a key 12–18 month milestone for hand-eye coordination, shape recognition, and trial-and-error persistence.",
          safety_notes:"Non-toxic paint. Splinter-free smooth wood. Supervise children under 3.",
          link:"https://www.mumzworld.com/en/melissa-doug-shape-sorting-cube" },
      ];
    } else {
      reply = "I'd love to help find the perfect product for your little one! To give you the best recommendations, could you tell me:\n\n• **How old is your baby?** (age in weeks or months)\n• **What challenge are you facing**, or what are you looking to buy?\n\nFor example: *\"My 4-month-old hates tummy time\"* or *\"Looking for a high chair for 6-month-old starting solids.\"*";
    }

    setMessages(prev => [...prev, { role: "assistant", content: reply, products }]);
    setLoading(false);
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  return (
    <div className="widget-wrapper">
      <div className="header">
        <div className="header-logo">
          <div className="logo-icon">🌸</div>
          <div className="logo-text">mumz<span>world</span></div>
        </div>
        <div className="header-sub">AI Parenting Advisor · Powered by Claude</div>
      </div>

      <div className="config-panel">
        <h4>⚙️ Backend Configuration</h4>
        <div className="config-row">
          <input
            className="api-input"
            type="password"
            placeholder="Paste Anthropic API key to use live backend…"
            value={apiKeyInput}
            onChange={e => setApiKeyInput(e.target.value)}
          />
          <button className="save-btn" onClick={saveApiKey}>Save</button>
        </div>
        <div className="mode-toggle">
          <label className="toggle-switch">
            <input type="checkbox" checked={demoMode} onChange={e => setDemoMode(e.target.checked)} />
            <span className="toggle-slider" />
          </label>
          {demoMode
            ? "Demo mode (mock responses) — start FastAPI backend + set API key for live mode"
            : `Live mode → ${BACKEND_URL}`}
        </div>
      </div>

      <div className="chat-container">
        <div className="chat-toolbar">
          <div className="toolbar-avatar">👶</div>
          <div className="toolbar-info">
            <div className="toolbar-name">Mumzworld Parenting Advisor</div>
            <div className="toolbar-status">
              <span className="status-dot" /> Online · Specialised in 0–8 years
            </div>
          </div>
          <div className="toolbar-badge">AI-powered</div>
        </div>

        <div className="messages">
          {messages.map((msg, i) => <MessageBubble key={i} msg={msg} />)}
          {loading && <TypingIndicator />}
          <div ref={messagesEndRef} />
        </div>

        {messages.length === 1 && (
          <div className="quick-prompts">
            {QUICK_PROMPTS.map(p => (
              <button key={p} className="quick-prompt-btn" onClick={() => sendMessage(p)}>
                {p}
              </button>
            ))}
          </div>
        )}

        {error && <div className="error-banner">⚠️ {error}</div>}

        <div className="input-area">
          <textarea
            ref={textareaRef}
            className="input-box"
            rows={1}
            placeholder="Ask about your baby's age and what you need…"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <button
            className="send-btn"
            onClick={() => sendMessage()}
            disabled={loading || !input.trim()}
            title="Send"
          >
            ➤
          </button>
        </div>
      </div>

      <div className="footer-note">
        Products from Mumzworld catalogue · Always follow safe sleep guidelines · Consult your paediatrician for medical advice
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
