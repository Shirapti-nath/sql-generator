  return grouped;
}

/* ── APP ── */
const mkWelcome=name=>({role:"assistant",content:name?`Hi ${name}'s mum/dad! 👋 I'm your Mumzworld advisor — I already know your little one's age and I'm ready to personalise every recommendation.\n\nWhat's on your mind today?`:`Hi there! 👋 I'm your Mumzworld parenting advisor.\n\nTell me your baby's age and what challenge you're facing — I'll recommend the right products from Mumzworld's catalogue.`,products:[],followups:[],time:Date.now()});

function App() {
  const loadP=()=>{try{return JSON.parse(localStorage.getItem("mw_profile"));}catch{return null;}};
  const loadW=()=>{try{return JSON.parse(localStorage.getItem("mw_wishlist"))||[];}catch{return[];}};

  const [profile,setProfile]=useState(loadP);
  const [showProfileModal,setShowProfileModal]=useState(!loadP());
  const [messages,setMessages]=useState(()=>[mkWelcome(loadP()?.name)]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [wishlist,setWishlist]=useState(loadW);
  const [showWishlist,setShowWishlist]=useState(false);
  const [compareList,setCompareList]=useState([]);
  const [showCompare,setShowCompare]=useState(false);
  const [lang,setLang]=useState("en");
  const [budget,setBudget]=useState(2000);
  const [showBudget,setShowBudget]=useState(false);
  const [listening,setListening]=useState(false);
  const [safetyAlert,setSafetyAlert]=useState(null);
  // New feature states
  const [showGiftFinder,setShowGiftFinder]=useState(false);
  const [showSymptomTriage,setShowSymptomTriage]=useState(false);
  const [shoppingList,setShoppingList]=useState(null);
  const endRef=useRef(null);
  const t=T[lang];
  const ageMonths=profile?.dob?calcAgeMonths(profile.dob):null;

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);
  useEffect(()=>{localStorage.setItem("mw_wishlist",JSON.stringify(wishlist));},[wishlist]);
  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";},[lang]);

  function saveProfile(name,dob){const p={name,dob};localStorage.setItem("mw_profile",JSON.stringify(p));setProfile(p);setShowProfileModal(false);setMessages([mkWelcome(name)]);}
  function toggleWishlist(id){setWishlist(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);}
  function toggleCompare(product){setCompareList(prev=>{if(prev.some(p=>p.id===product.id))return prev.filter(p=>p.id!==product.id);if(prev.length>=3)return prev;return[...prev,product];});}

  function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Voice input not supported in this browser. Try Chrome.");return;}
    const r=new SR();r.lang=lang==="ar"?"ar-AE":"en-US";
    r.onresult=e=>{
      const transcript=e.results[0][0].transcript;
      // Feature 3: detect if this is a shopping list memo
      const hasMultiple=transcript.split(/,|and\s|also\s|then\s|plus\s/).length>=3||transcript.toLowerCase().includes("list")||transcript.toLowerCase().includes("need to buy")||transcript.toLowerCase().includes("shopping");
      if(hasMultiple){
        const grouped=parseShoppingList(transcript);
        if(Object.keys(grouped).length>0){setShoppingList(grouped);setListening(false);return;}
      }
      setInput(transcript);setListening(false);
    };
    r.onerror=()=>setListening(false);r.onend=()=>setListening(false);
    setListening(true);r.start();
  }

  async function sendMessage(text){
    const userText=(text||input).trim();if(!userText||loading)return;
    setInput("");
    const alert=checkSafety(userText);if(alert)setSafetyAlert(alert);
    const enriched=userText+(profile?.dob?` (baby age: ${formatAge(ageMonths)})`:"");
    setMessages(prev=>[...prev,{role:"user",content:userText,products:[],followups:[],time:Date.now()}]);
    setLoading(true);
    await new Promise(r=>setTimeout(r,1000));
    const{reply,products,followups}=generateResponse(enriched,budget,profile?.name);
    setMessages(prev=>[...prev,{role:"assistant",content:reply,products,followups,time:Date.now()}]);
    setLoading(false);
  }

  return (
    <>
      {showProfileModal&&<ProfileModal onSave={saveProfile} onSkip={()=>setShowProfileModal(false)}/>}
      {showWishlist&&<WishlistDrawer wishlist={wishlist} toggleWishlist={toggleWishlist} onClose={()=>setShowWishlist(false)} t={t} lang={lang} compareList={compareList} toggleCompare={toggleCompare} budget={budget} babyName={profile?.name}/>}
      {showCompare&&compareList.length>=2&&<CompareModal items={compareList} onClose={()=>setShowCompare(false)}/>}
      {showGiftFinder&&<GiftFinderModal onClose={()=>setShowGiftFinder(false)} lang={lang}/>}
      {showSymptomTriage&&<SymptomTriageModal onClose={()=>setShowSymptomTriage(false)} lang={lang}/>}
      {shoppingList&&<ShoppingListModal grouped={shoppingList} onClose={()=>setShoppingList(null)} babyName={profile?.name} lang={lang}/>}

      <div className="widget-wrapper">
        <div className="header">
          <div className="header-actions">
            <button className="icon-btn lang-btn" onClick={()=>setLang(l=>l==="en"?"ar":"en")}>{lang==="en"?"عربي":"EN"}</button>
            <button className="icon-btn" onClick={()=>setShowBudget(s=>!s)} title="Budget">💰</button>
            <button className="icon-btn" onClick={()=>setShowWishlist(true)} title="Wishlist">❤️{wishlist.length>0&&<span className="badge">{wishlist.length}</span>}</button>
            <button className="icon-btn" onClick={()=>setShowProfileModal(true)} title="Baby profile">👶</button>
          </div>
          <div className="header-logo"><div className="logo-icon">🌸</div><div className="logo-text">mumz<span>world</span></div></div>
          {profile?.name&&<div className="baby-profile-pill" onClick={()=>setShowProfileModal(true)}><span>👶</span><div><div className="baby-name">{profile.name}</div>{ageMonths!==null&&<div className="baby-age">{formatAge(ageMonths)}</div>}</div></div>}
          <div className="header-sub">{t.subheader}</div>
        </div>

        <MilestoneBar ageMonths={ageMonths} onSelect={q=>sendMessage(q)} t={t}/>
        {showBudget&&<BudgetBar budget={budget} setBudget={setBudget} t={t}/>}
        {safetyAlert&&<div className="safety-alert"><div className="safety-alert-icon">🚨</div><div><div className="safety-alert-title">{safetyAlert.title}</div><div className="safety-alert-body">{safetyAlert.body}</div></div><button className="safety-dismiss" onClick={()=>setSafetyAlert(null)}>✕</button></div>}

        <div className="chat-container">
          <div className="chat-toolbar">
            <div className="toolbar-avatar">👶</div>
            <div className="toolbar-info">
              <div className="toolbar-name">Mumzworld Parenting Advisor</div>
              <div className="toolbar-status"><span className="status-dot"/> {t.online}</div>
            </div>
            <div className="toolbar-tools">
              <button className="tool-btn" onClick={()=>setShowGiftFinder(true)} title="Gift Finder">🎁 {lang==="ar"?"هدايا":"Gifts"}</button>
              <button className="tool-btn" onClick={()=>setShowSymptomTriage(true)} title="Symptom Check">🏥 {lang==="ar"?"أعراض":"Symptoms"}</button>
            </div>
          </div>
          <div className="messages">
            {messages.map((msg,i)=><MsgBubble key={i} msg={msg} wishlist={wishlist} toggleWishlist={toggleWishlist} compareList={compareList} toggleCompare={toggleCompare} budget={budget} babyName={profile?.name} lang={lang} onFollowup={q=>sendMessage(q)}/>)}
            {loading&&<TypingIndicator/>}
            <div ref={endRef}/>
          </div>
          {messages.length===1&&<div className="quick-prompts">{t.quickPrompts.map(p=><button key={p} className="quick-prompt-btn" onClick={()=>sendMessage(p)}>{p}</button>)}</div>}
          <div className="input-area">
            <button className={`voice-btn${listening?" listening":""}`} onClick={startVoice} title="Voice / Shopping List">🎤</button>
            <textarea className="input-box" rows={1} placeholder={t.placeholder} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}/>
            <button className="send-btn" onClick={()=>sendMessage()} disabled={loading||!input.trim()}>➤</button>
          </div>
        </div>

        <div className="footer-note">Products verified on Mumzworld · Always follow safe sleep guidelines · Consult your paediatrician for medical advice</div>
      </div>

      {compareList.length>=2&&<div className="compare-float">⚖️ {compareList.length} selected<button className="cmp-btn" onClick={()=>setShowCompare(true)}>Compare →</button><button className="clr-btn" onClick={()=>setCompareList([])}>Clear</button></div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
