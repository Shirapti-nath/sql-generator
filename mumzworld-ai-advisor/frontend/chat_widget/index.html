function calcAgeMonths(dob) {
  const now = new Date(), birth = new Date(dob);
  return Math.max(0, (now.getFullYear()-birth.getFullYear())*12 + (now.getMonth()-birth.getMonth()));
}
function formatAge(m) {
  if (m < 1) return "Newborn";
  if (m < 12) return `${m} month${m>1?"s":""} old`;
  const y=Math.floor(m/12), r=m%12;
  return r ? `${y}yr ${r}mo` : `${y} year${y>1?"s":""} old`;
}
function checkSafety(q) {
  const ql = q.toLowerCase();
  for (const t of SAFETY_TRIGGERS) if (t.keys.some(k=>ql.includes(k))) return t;
  return null;
}
function waText(products, babyName) {
  const name = babyName || "my baby";
  const lines = products.map((p,i)=>`${i+1}. ${p.name} — AED ${p.price}\n${p.link}`).join("\n\n");
  return `https://wa.me/?text=${encodeURIComponent(`🛍️ Mumzworld picks for ${name}:\n\n${lines}\n\nShop at mumzworld.com`)}`;
}
function getFollowups(q) {
  const ql = q.toLowerCase();
  if (ql.includes("tummy")) return FOLLOWUPS.tummy;
  if (ql.includes("teet")||ql.includes("drool")) return FOLLOWUPS.teething;
  if (ql.includes("sleep")||ql.includes("newborn")||ql.includes("hold")) return FOLLOWUPS.sleep;
  if (ql.includes("solid")||ql.includes("high chair")||ql.includes("wean")) return FOLLOWUPS.solids;
  if (ql.includes("toddler")||ql.includes("18")||ql.includes("educat")) return FOLLOWUPS.toddler;
  if (ql.includes("walk")||ql.includes("stand")||ql.includes("step")) return FOLLOWUPS.walker;
  return FOLLOWUPS.general;
}
function generateResponse(q, budget, babyName) {
  const ql = q.toLowerCase();
  const nick = babyName || "your little one";
  const ok = p => budget >= 2000 || p.price <= budget;
  let reply, products=[], fkey="general";
  if (ql.includes("tummy")||(ql.includes("4 month")&&!ql.includes("solid"))) {
    reply=`That fussiness during tummy time is so common — you're not alone! 💛 ${nick} is building the neck and core strength needed to roll and sit.\n\nHere are my top picks:`;
    products=PRODUCTS.filter(p=>["MW-003","MW-001","MW-002"].includes(p.id)&&ok(p)); fkey="tummy";
  } else if (ql.includes("teet")||ql.includes("drool")||ql.includes("chew")||ql.includes("gum")) {
    reply=`Sounds like teething is starting — it can begin as early as 3 months! The drooling and chewing are classic early signs. 🦷\n\nSafest options for ${nick}:`;
    products=PRODUCTS.filter(p=>["MW-010","MW-011"].includes(p.id)&&ok(p)); fkey="teething";
  } else if (ql.includes("sleep")||ql.includes("hold")||ql.includes("newborn")||ql.includes("swaddle")) {
    reply=`Oh, the 'only-sleep-when-held' stage is exhausting — but so understandable! 💗 ${nick} just left the womb and your heartbeat is their favourite comfort.\n\nThese help safely:`;
    products=PRODUCTS.filter(p=>["MW-019","MW-004","MW-005"].includes(p.id)&&ok(p)); fkey="sleep";
  } else if (ql.includes("high chair")||ql.includes("solid")||ql.includes("wean")||ql.includes("6 month")) {
    reply=`How exciting — starting solids is such a big milestone! At 6 months the goal is upright posture with support. Best options for ${nick}:`;
    products=PRODUCTS.filter(p=>["MW-009","MW-008","MW-018"].includes(p.id)&&ok(p)); fkey="solids";
  } else if (ql.includes("18 month")||ql.includes("toddler")||ql.includes("educat")||ql.includes("creative")||ql.includes("learn")) {
    reply=`18 months is such a fun age — little sponges who learn through play! 🧩 Top educational picks for ${nick}:`;
    products=PRODUCTS.filter(p=>["MW-015","MW-025","MW-013"].includes(p.id)&&ok(p)); fkey="toddler";
  } else if (ql.includes("walk")||ql.includes("stand")||ql.includes("step")||ql.includes("crawl")) {
    reply=`Those first steps are such a magical milestone! 🏃 Products to support ${nick} on that journey:`;
    products=PRODUCTS.filter(p=>["MW-014"].includes(p.id)&&ok(p)); fkey="walker";
  } else if (ql.includes("carrier")||ql.includes("carry")||ql.includes("babywear")||ql.includes("fussy")) {
    reply=`Babywearing is wonderful for fussy babies — the closeness and rhythm of your movement is deeply calming. 💗 Recommendation for ${nick}:`;
    products=PRODUCTS.filter(p=>["MW-016","MW-004"].includes(p.id)&&ok(p)); fkey="sleep";
  } else if (ql.includes("bottle")||ql.includes("breastfeed")||ql.includes("feed")) {
    reply=`Feeding questions are so important — here are trusted products for ${nick}:`;
    products=PRODUCTS.filter(p=>["MW-006","MW-018"].includes(p.id)&&ok(p)); fkey="solids";
  } else {
    reply=`I'd love to find the perfect products for ${nick}! Could you tell me:\n\n• **How old is your baby?** (in weeks or months)\n• **What challenge are you facing?**\n\nFor example: *"My 4-month-old hates tummy time"* or *"Starting solids at 6 months."*`;
    products=[]; fkey="general";
  }
  if (products.length===0&&ql.length>10&&!reply.includes("Could you tell me"))
    reply+="\n\n*(All matching products are over your current budget — try raising the budget slider!)*";
  return { reply, products, followups: FOLLOWUPS[fkey] };
}

const mkWelcome = name => ({ role:"assistant", content: name ? `Hi ${name}'s mum/dad! 👋 I'm your Mumzworld advisor — I already know your little one's age and I'm ready to personalise every recommendation.\n\nWhat's on your mind today?` : `Hi there! 👋 I'm your Mumzworld parenting advisor.\n\nTell me your baby's age and what challenge you're facing — I'll recommend the right products from Mumzworld's catalogue.`, products:[], followups:[], time:Date.now() });

function App() {
  const loadProfile = () => { try { return JSON.parse(localStorage.getItem("mw_profile")); } catch { return null; } };
  const loadWishlist = () => { try { return JSON.parse(localStorage.getItem("mw_wishlist"))||[]; } catch { return []; } };

  const [profile, setProfile] = useState(loadProfile);
  const [showProfileModal, setShowProfileModal] = useState(!loadProfile());
  const [messages, setMessages] = useState(() => [mkWelcome(loadProfile()?.name)]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [wishlist, setWishlist] = useState(loadWishlist);
  const [showWishlist, setShowWishlist] = useState(false);
  const [compareList, setCompareList] = useState([]);
  const [showCompare, setShowCompare] = useState(false);
  const [lang, setLang] = useState("en");
  const [budget, setBudget] = useState(2000);
  const [showBudget, setShowBudget] = useState(false);
  const [listening, setListening] = useState(false);
  const [safetyAlert, setSafetyAlert] = useState(null);
  const endRef = useRef(null);
  const t = T[lang];
  const ageMonths = profile?.dob ? calcAgeMonths(profile.dob) : null;

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[messages,loading]);
  useEffect(()=>{ localStorage.setItem("mw_wishlist",JSON.stringify(wishlist)); },[wishlist]);
  useEffect(()=>{ document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr"; },[lang]);

  function saveProfile(name,dob) {
    const p={name,dob}; localStorage.setItem("mw_profile",JSON.stringify(p));
    setProfile(p); setShowProfileModal(false); setMessages([mkWelcome(name)]);
  }
  function toggleWishlist(id) { setWishlist(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]); }
  function toggleCompare(product) {
    setCompareList(prev=>{ if(prev.some(p=>p.id===product.id)) return prev.filter(p=>p.id!==product.id); if(prev.length>=3) return prev; return [...prev,product]; });
  }
  function startVoice() {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Voice input not supported in this browser. Try Chrome.");return;}
    const r=new SR(); r.lang=lang==="ar"?"ar-AE":"en-US";
    r.onresult=e=>{setInput(e.results[0][0].transcript);setListening(false);};
    r.onerror=()=>setListening(false); r.onend=()=>setListening(false);
    setListening(true); r.start();
  }
  async function sendMessage(text) {
    const userText=(text||input).trim(); if(!userText||loading) return;
    setInput("");
    const alert=checkSafety(userText); if(alert) setSafetyAlert(alert);
    const enriched=userText+(profile?.dob?` (baby age: ${formatAge(ageMonths)})`:"");
    setMessages(prev=>[...prev,{role:"user",content:userText,products:[],followups:[],time:Date.now()}]);
    setLoading(true);
    await new Promise(r=>setTimeout(r,1000));
    const {reply,products,followups}=generateResponse(enriched,budget,profile?.name);
    setMessages(prev=>[...prev,{role:"assistant",content:reply,products,followups,time:Date.now()}]);
    setLoading(false);
  }

  return (
    <>
      {showProfileModal&&<ProfileModal onSave={saveProfile} onSkip={()=>setShowProfileModal(false)}/>}
      {showWishlist&&<WishlistDrawer wishlist={wishlist} toggleWishlist={toggleWishlist} onClose={()=>setShowWishlist(false)} t={t} lang={lang} compareList={compareList} toggleCompare={toggleCompare} budget={budget} babyName={profile?.name}/>}
      {showCompare&&compareList.length>=2&&<CompareModal items={compareList} onClose={()=>setShowCompare(false)}/>}

      <div className="widget-wrapper">
        <div className="header">
          <div className="header-actions">
            <button className="icon-btn lang-btn" onClick={()=>setLang(l=>l==="en"?"ar":"en")} title="Toggle language">{lang==="en"?"عربي":"EN"}</button>
            <button className="icon-btn" onClick={()=>setShowBudget(s=>!s)} title="Budget filter">💰</button>
            <button className="icon-btn" onClick={()=>setShowWishlist(true)} title="Wishlist">❤️{wishlist.length>0&&<span className="badge">{wishlist.length}</span>}</button>
            <button className="icon-btn" onClick={()=>setShowProfileModal(true)} title="Baby profile">👶</button>
          </div>
          <div className="header-logo">
            <div className="logo-icon">🌸</div>
            <div className="logo-text">mumz<span>world</span></div>
          </div>
          {profile?.name&&(
            <div className="baby-profile-pill" onClick={()=>setShowProfileModal(true)}>
              <span>👶</span>
              <div><div className="baby-name">{profile.name}</div>{ageMonths!==null&&<div className="baby-age">{formatAge(ageMonths)}</div>}</div>
            </div>
          )}
          <div className="header-sub">{t.subheader}</div>
        </div>

        <MilestoneBar ageMonths={ageMonths} onSelect={q=>sendMessage(q)} t={t}/>
        {showBudget&&<BudgetBar budget={budget} setBudget={setBudget} t={t}/>}

        {safetyAlert&&(
          <div className="safety-alert">
            <div className="safety-alert-icon">🚨</div>
            <div><div className="safety-alert-title">{safetyAlert.title}</div><div className="safety-alert-body">{safetyAlert.body}</div></div>
            <button className="safety-dismiss" onClick={()=>setSafetyAlert(null)}>✕</button>
          </div>
        )}

        <div className="chat-container">
          <div className="chat-toolbar">
            <div className="toolbar-avatar">👶</div>
            <div className="toolbar-info">
              <div className="toolbar-name">Mumzworld Parenting Advisor</div>
              <div className="toolbar-status"><span className="status-dot"/> {t.online}</div>
            </div>
            <div className="toolbar-badge">{t.aiPowered}</div>
          </div>
          <div className="messages">
            {messages.map((msg,i)=><MsgBubble key={i} msg={msg} wishlist={wishlist} toggleWishlist={toggleWishlist} compareList={compareList} toggleCompare={toggleCompare} budget={budget} babyName={profile?.name} lang={lang} onFollowup={q=>sendMessage(q)}/>)}
            {loading&&<TypingIndicator/>}
            <div ref={endRef}/>
          </div>
          {messages.length===1&&(
            <div className="quick-prompts">
              {t.quickPrompts.map(p=><button key={p} className="quick-prompt-btn" onClick={()=>sendMessage(p)}>{p}</button>)}
            </div>
          )}
          <div className="input-area">
            <button className={`voice-btn${listening?" listening":""}`} onClick={startVoice} title="Voice input">🎤</button>
            <textarea className="input-box" rows={1} placeholder={t.placeholder} value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}/>
            <button className="send-btn" onClick={()=>sendMessage()} disabled={loading||!input.trim()}>➤</button>
          </div>
        </div>

        <div className="footer-note">Products from Mumzworld catalogue · Always follow safe sleep guidelines · Consult your paediatrician for medical advice</div>
      </div>

      {compareList.length>=2&&(
        <div className="compare-float">
          ⚖️ {compareList.length} products selected
          <button className="cmp-btn" onClick={()=>setShowCompare(true)}>Compare →</button>
          <button className="clr-btn" onClick={()=>setCompareList([])}>Clear</button>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
